name: CI/CD Pipeline

on:
  push:
    branches:
      - prod  # Trigger only on pushes to the production branch

env:
  PROD_APP_IMAGE: ghcr.io/${{ secrets.NAMESPACE }}/prod_app
  PROD_DB_IMAGE: ghcr.io/${{ secrets.NAMESPACE }}/prod_db

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file for build
        run: |
          echo DB_USER=${{ secrets.PROD_DB_USER }} >> .env
          echo DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} >> .env
          echo DB_NAME=${{ secrets.PROD_DB_NAME }} >> .env
          echo DB_PORT=${{ secrets.PROD_DB_PORT }} >> .env

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ secrets.NAMESPACE }}
          password: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Pull cache images (optional)
        run: |
          docker pull $PROD_APP_IMAGE || true
          docker pull $PROD_DB_IMAGE || true

      - name: Build Docker images
        run: docker-compose -f docker-compose.cdci.yml build

      - name: Push Docker images
        run: |
          docker push $PROD_APP_IMAGE
          docker push $PROD_DB_IMAGE

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create .env file for deployment
        run: |
          echo SECRET_KEY=${{ secrets.PROD_SECRET_KEY }} >> .env
          echo DJANGO_ALLOWED_HOSTS=${{ secrets.PROD_DJANGO_ALLOWED_HOSTS }} >> .env
          echo DB_USER=${{ secrets.PROD_DB_USER }} >> .env
          echo DB_PASSWORD=${{ secrets.PROD_DB_PASSWORD }} >> .env
          echo DB_NAME=${{ secrets.PROD_DB_NAME }} >> .env
          echo DB_PORT=${{ secrets.PROD_DB_PORT }} >> .env
          echo DB_HOST=${{ secrets.PROD_DB_HOST }} >> .env
          echo APP_IMAGE=${{ env.PROD_APP_IMAGE }} >> .env
          echo DB_IMAGE=${{ env.PROD_DB_IMAGE }} >> .env

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.PROD_PRIVATE_KEY }}

      - name: Copy files to production server
        run: |
          scp -o StrictHostKeyChecking=no .env root@${{ secrets.PROD_IP_ADDRESS }}:/home/course/
          scp -o StrictHostKeyChecking=no -r ./app/backend ./app/nginx ./docker-compose.prod.yml ./pg_init_prod.sql root@${{ secrets.PROD_IP_ADDRESS }}:/home/course/

      - name: Deploy on server
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.PROD_IP_ADDRESS }} << 'EOF'
            cd /home/course
            mv docker-compose.prod.yml docker-compose.yml
            cd backend
            mv manage.prod.py manage.py || true
            cd course
            mv wsgi.prod.py wsgi.py || true
            cd ../..
            echo "${{ secrets.PERSONAL_ACCESS_TOKEN }}" | docker login ghcr.io -u ${{ secrets.NAMESPACE }} --password-stdin
            docker pull $APP_IMAGE
            docker pull $DB_IMAGE
            docker-compose up -d
          EOF
