version: '3'

services:

  app:
    image: "app_image"
    restart: unless-stopped
    command: >
       bash -c "python manage.py makemigrations
       && gunicorn -c gunicorn.conf.py --env DJANGO_SETTINGS_MODULE=course.conf.prod course.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/code
      - /var/log/course:/code/logs
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - main_course_network
    container_name: app


