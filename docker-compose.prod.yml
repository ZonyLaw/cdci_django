version: '3'

services:

  db:
    image: "${DB_IMAGE}"
    restart: unless-stopped
    environment:
        - POSTGRES_USER=${DB_USER}
        - POSTGRES_PASSWORD=${DB_PASSWORD}
        - POSTGRES_DB=${DB_NAME}
        - POSTGRES_PORT= ${DB_PORT}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  app:
    image: "app_image"
    restart: unless-stopped
    command: >
       bash -c "python manage.py makemigrations
       && python manage.py migrate
       && gunicorn -c gunicorn.conf.py --env DJANGO_SETTINGS_MODULE=course.conf.prod course.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/code
      - /var/log/course:/code/logs
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - main_course_network
    container_name: app


